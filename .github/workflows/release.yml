name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agentd/go.mod
          cache-dependency-path: agentd/go.mod

      - name: Validate tag and source version
        run: |
          version=$(sed -n '1p' VERSION)
          test "${GITHUB_REF_NAME}" = "v${version}"
          node scripts/validate-version.mjs

      - name: Build release
        run: make release

      - name: Prepare public installer metadata
        run: |
          install -m 0755 scripts/hobot-release.sh dist/hobot-install.sh
          install -m 0644 VERSION dist/hobot-code-version.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/hobot-code-*-linux-arm64.tar.gz
            dist/hobot-install.sh
            dist/hobot-code-version.txt

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: |
            dist/hobot-code-*-linux-arm64.tar.gz
            dist/hobot-code-*-linux-arm64.tar.gz.sha256
            dist/hobot-install.sh
            dist/hobot-code-version.txt
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: studio/go.mod
          cache-dependency-path: |
            sdk/go/go.mod
            studio/go.sum

      - name: Validate tag and source version
        run: |
          version=$(sed -n '1p' VERSION)
          test "${GITHUB_REF_NAME}" = "v${version}"
          node scripts/validate-version.mjs

      - name: Build macOS ARM64 release
        run: make studio-macos-release

      - name: Attest desktop artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/hobot-code-*-macos-arm64.dmg

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: |
            dist/hobot-code-*-macos-arm64.dmg
            dist/hobot-code-*-macos-arm64.dmg.sha256
          if-no-files-found: error

  publish:
    needs:
      - linux-arm64
      - macos-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '1p' VERSION)
          prerelease=
          case "$version" in *-*) prerelease=--prerelease ;; esac
          gh release create "v$version" \
            dist/hobot-code-$version-linux-arm64.tar.gz \
            dist/hobot-code-$version-linux-arm64.tar.gz.sha256 \
            dist/hobot-code-$version-macos-arm64.dmg \
            dist/hobot-code-$version-macos-arm64.dmg.sha256 \
            dist/hobot-install.sh \
            dist/hobot-code-version.txt \
            --verify-tag \
            --title "Hobot Code $version" \
            --generate-notes \
            $prerelease
