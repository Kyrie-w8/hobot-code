name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agentd/go.mod
          cache-dependency-path: agentd/go.mod

      - name: Validate tag and source version
        run: |
          version=$(sed -n '1p' VERSION)
          test "${GITHUB_REF_NAME}" = "v${version}"
          node scripts/validate-version.mjs

      - name: Build release
        run: make release

      - name: Prepare public installer metadata
        run: |
          install -m 0755 scripts/hobot-release.sh dist/hobot-install.sh
          install -m 0644 VERSION dist/hobot-code-version.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/hobot-code-*-linux-arm64.tar.gz
            dist/hobot-install.sh
            dist/hobot-code-version.txt

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: |
            dist/hobot-code-*-linux-arm64.tar.gz
            dist/hobot-code-*-linux-arm64.tar.gz.sha256
            dist/hobot-install.sh
            dist/hobot-code-version.txt
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: studio/go.mod
          cache-dependency-path: |
            sdk/go/go.mod
            studio/go.sum

      - name: Validate tag and source version
        run: |
          version=$(sed -n '1p' VERSION)
          test "${GITHUB_REF_NAME}" = "v${version}"
          node scripts/validate-version.mjs

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATE_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          certificate="$RUNNER_TEMP/hobot-code-developer-id.p12"
          keychain="$RUNNER_TEMP/hobot-code-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain"
          rm -f "$certificate"
          echo "HOBOT_CODE_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Prepare Apple notarization key
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          test -n "$APPLE_NOTARY_KEY_BASE64"
          key="$RUNNER_TEMP/hobot-code-notary.p8"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "HOBOT_CODE_NOTARY_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build macOS ARM64 release
        env:
          HOBOT_CODE_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          HOBOT_CODE_REQUIRE_SIGNED_RELEASE: "1"
          HOBOT_CODE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          HOBOT_CODE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: make studio-macos-release

      - name: Remove signing credentials
        if: always()
        run: |
          if [ -n "${HOBOT_CODE_NOTARY_KEY_PATH:-}" ]; then
            rm -f "$HOBOT_CODE_NOTARY_KEY_PATH"
          fi
          if [ -n "${HOBOT_CODE_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$HOBOT_CODE_SIGNING_KEYCHAIN" || true
          fi

      - name: Attest desktop artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/hobot-code-*-macos-arm64.dmg

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: |
            dist/hobot-code-*-macos-arm64.dmg
            dist/hobot-code-*-macos-arm64.dmg.sha256
          if-no-files-found: error

  publish:
    needs:
      - linux-arm64
      - macos-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '1p' VERSION)
          prerelease=
          case "$version" in *-*) prerelease=--prerelease ;; esac
          gh release create "v$version" \
            dist/hobot-code-$version-linux-arm64.tar.gz \
            dist/hobot-code-$version-linux-arm64.tar.gz.sha256 \
            dist/hobot-code-$version-macos-arm64.dmg \
            dist/hobot-code-$version-macos-arm64.dmg.sha256 \
            dist/hobot-install.sh \
            dist/hobot-code-version.txt \
            --verify-tag \
            --title "Hobot Code $version" \
            --generate-notes \
            --draft \
            $prerelease

      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '1p' VERSION)
          verification="$RUNNER_TEMP/hobot-code-release-$version"
          mkdir -p "$verification"
          gh release download "v$version" --dir "$verification"
          cd "$verification"
          cat > expected-assets.txt <<EOF
          hobot-code-$version-linux-arm64.tar.gz
          hobot-code-$version-linux-arm64.tar.gz.sha256
          hobot-code-$version-macos-arm64.dmg
          hobot-code-$version-macos-arm64.dmg.sha256
          hobot-code-version.txt
          hobot-install.sh
          EOF
          gh release view "v$version" --json assets --jq '.assets[].name' | sort > actual-assets.txt
          sort -o expected-assets.txt expected-assets.txt
          diff -u expected-assets.txt actual-assets.txt
          verify_checksum() {
            checksum_file=$1
            artifact=$2
            record=$(sed -n '1p' "$checksum_file")
            expected=$(printf '%s\n' "$record" | awk '{print $1}')
            target=$(printf '%s\n' "$record" | awk '{print $2}')
            case "$target" in \** ) target=${target#\*} ;; esac
            test "$target" = "$artifact"
            test "$expected" = "$(sha256sum "$artifact" | awk '{print $1}')"
          }
          verify_checksum "hobot-code-$version-linux-arm64.tar.gz.sha256" "hobot-code-$version-linux-arm64.tar.gz"
          verify_checksum "hobot-code-$version-macos-arm64.dmg.sha256" "hobot-code-$version-macos-arm64.dmg"
          gh release edit "v$version" --draft=false
