[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-agent-runtime"
version = "0.1.0"
description = "Portable, policy-aware agent runtime for D-Robotics embedded boards"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=5.4.1,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
edge-agent = "edge_agent.cli:main"

[tool.setuptools.packages.find]
include = ["edge_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
