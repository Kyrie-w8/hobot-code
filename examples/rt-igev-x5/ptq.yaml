model_parameters:
  onnx_model: './rt_igev_sceneflow_256x320_iter8_opset11_x5.onnx'
  march: 'bayes-e'
  output_model_file_prefix: 'rt_igev_sceneflow_256x320_iter8_x5'
  working_dir: './ptq_output'
  layer_out_dump: false

input_parameters:
  input_name: 'left;right'
  input_type_train: 'featuremap;featuremap'
  input_layout_train: 'NCHW;NCHW'
  input_type_rt: 'featuremap;featuremap'
  input_layout_rt: 'NCHW;NCHW'
  input_shape: '1x3x256x320;1x3x256x320'
  norm_type: 'no_preprocess;no_preprocess'

calibration_parameters:
  cal_data_dir: './data/calibration/left;./data/calibration/right'
  cal_data_type: 'float32;float32'
  preprocess_on: false
  calibration_type: 'default'
  per_channel: false

compiler_parameters:
  compile_mode: 'latency'
  optimize_level: 'O3'
  core_num: 1
  debug: false
  jobs: 16
