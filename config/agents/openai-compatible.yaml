extends: ../base.yaml

model:
  provider: openai_compatible
  name: ${MODEL_NAME:-local-model}
  api_key: ${MODEL_API_KEY:-}
  base_url: ${MODEL_BASE_URL:-http://127.0.0.1:8080/v1}
  settings:
    temperature: 0.2

memory:
  path: ../../var/sessions.db
prompts:
  layers:
    - name: policy
      priority: 10
      path: ../../prompts/base.md
skills:
  roots:
    - ../../skills
