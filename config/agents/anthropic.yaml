extends: ../base.yaml

model:
  provider: anthropic
  name: ${ANTHROPIC_MODEL:-YOUR_ANTHROPIC_MODEL}
  api_key: ${ANTHROPIC_API_KEY:-}
  base_url: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
  settings:
    max_tokens: 2048

memory:
  path: ../../var/sessions.db
prompts:
  layers:
    - name: policy
      priority: 10
      path: ../../prompts/base.md
skills:
  roots:
    - ../../skills
