extends: ../base.yaml

model:
  provider: openai_responses
  name: ${OPENAI_MODEL:-gpt-5.6-terra}
  api_key: ${OPENAI_API_KEY:-}
  base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  settings:
    store: false
    parallel_tool_calls: false

memory:
  path: ../../var/sessions.db
prompts:
  layers:
    - name: policy
      priority: 10
      path: ../../prompts/base.md
skills:
  roots:
    - ../../skills
