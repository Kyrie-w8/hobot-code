version: 1

runtime:
  max_steps: 8
  tool_timeout_seconds: 15

board:
  profile: generic
  model: unknown
  prompt: >-
    You are running on the {{board_profile}} embedded profile. Treat model output as
    control-plane guidance, never as a hard real-time actuator command.

agent:
  name: EdgeAgent
  skills:
    - system-info
  prompt: >-
    Complete the user's task with the smallest relevant tool set. Report tool errors
    accurately and never claim an action succeeded unless the tool result confirms it.

model:
  provider: mock
  name: offline-mock
  timeout_seconds: 60
  settings: {}

memory:
  path: ../var/sessions.db

prompts:
  layers:
    - name: policy
      priority: 10
      path: ../prompts/base.md

skills:
  roots:
    - ../skills

security:
  allowed_tools:
    - system.*
  denied_tools:
    - shell.*
    - system.power_*
  approval_tools: []
  approve_write_tools: false
  filesystem_roots: []
